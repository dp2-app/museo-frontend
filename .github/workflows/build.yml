name: build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Pruebas unitarias (sin backend ni navegador). Las e2e (test:f0, test:f9…) necesitan backend y Chrome: van aparte.
      - run: npm run test:unit
      - run: npm run build
